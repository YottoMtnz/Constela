<style>
:root{
  --bg:#FAF7FC; --panel:#F2EDF6; --raise:#FFFFFF; --sunk:#EAE3F0; --line:#E0D6E9; --line2:#CFC2DB;
  --text:#241B2E; --mute:#6C5E78; --faint:#9A8DA6;
  --accent:#B06F08; --accent-2:#F2B33D; --accent-ink:#FFFFFF; --accent-soft:#F7E6C6;
  --ok:#187567; --warn:#9A5B00; --err:#B4233C; --err-soft:#FBE3E7;
  --code-bg:#F5F0F9; --shadow:0 18px 50px -24px rgba(48,26,66,.35);
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --side:276px;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1423; --panel:#221A2C; --raise:#2B2236; --sunk:#160F1D; --line:#382C45; --line2:#4A3B5A;
    --text:#EFE7F5; --mute:#AE9FBC; --faint:#7E6F8D;
    --accent:#F2B33D; --accent-2:#F2B33D; --accent-ink:#2A1A00; --accent-soft:#3D2E1A;
    --ok:#62C7B9; --warn:#F2B33D; --err:#F27C8E; --err-soft:#3A1F2A;
    --code-bg:#160F1D; --shadow:0 20px 60px -20px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1423; --panel:#221A2C; --raise:#2B2236; --sunk:#160F1D; --line:#382C45; --line2:#4A3B5A;
  --text:#EFE7F5; --mute:#AE9FBC; --faint:#7E6F8D;
  --accent:#F2B33D; --accent-2:#F2B33D; --accent-ink:#2A1A00; --accent-soft:#3D2E1A;
  --ok:#62C7B9; --warn:#F2B33D; --err:#F27C8E; --err-soft:#3A1F2A;
  --code-bg:#160F1D; --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr) auto;height:100dvh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#panel{width:0;overflow:hidden;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;transition:width .22s ease}
#panel.open{width:min(560px,46vw)}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 8px}
.brand b{font:800 26px/1 var(--f-disp);letter-spacing:-.03em}
.brand .spacer{flex:1}
.side-new{margin:8px 14px 6px;display:flex;align-items:center;gap:8px;justify-content:center;padding:10px 12px;border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);font-weight:600}
.side-new:hover{filter:brightness(1.06)}
.side-search{margin:6px 14px 4px;position:relative}
.side-search input{width:100%;padding:8px 10px 8px 32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--raise);outline:none}
.side-search input:focus{border-color:var(--accent)}
.side-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint)}
.side-scroll{flex:1;overflow:auto;padding:4px 8px 12px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 4px;color:var(--mute);font-size:12.5px;font-weight:600}
.side-h button{color:var(--mute);padding:2px 4px;border-radius:6px}
.side-h button:hover{color:var(--text);background:var(--sunk)}
.row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);color:var(--text);width:100%;text-align:left;position:relative}
.row:hover{background:var(--sunk)}
.row.on{background:var(--raise);box-shadow:inset 0 0 0 1px var(--line)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row .n{color:var(--faint);font-size:12px}
.row .dot{width:9px;height:9px;border-radius:50%;flex:none}
.row .more{opacity:0;color:var(--mute);padding:2px;border-radius:5px}
.row:hover .more,.row.on .more,.row .more:focus-visible{opacity:1}
.row .more:hover{background:var(--line)}
.grp{padding:10px 10px 2px;color:var(--faint);font-size:12px}
.side-foot{border-top:1px solid var(--line);padding:8px;display:flex;gap:4px}
.side-foot button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);color:var(--mute);font-size:14px}
.side-foot button:hover{background:var(--sunk);color:var(--text)}
.side-foot .grow{flex:1}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid transparent;min-height:56px}
#top.scrolled{border-bottom-color:var(--line)}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;color:var(--mute)}
.icon-btn:hover{background:var(--sunk);color:var(--text)}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
#menuBtn{display:none}
#chatTitle{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 6px;border-radius:8px;border:1px solid transparent;background:none;outline:none}
#chatTitle:hover{border-color:var(--line)}
#chatTitle:focus{border-color:var(--accent);background:var(--raise)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px 6px 9px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:13.5px;max-width:260px}
.chip:hover{border-color:var(--line2)}
.chip .pdot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip svg{width:14px;height:14px;color:var(--faint)}

/* ---------- thread ---------- */
#scroll{flex:1;overflow:auto;scroll-behavior:auto}
#thread{max-width:800px;margin:0 auto;padding:8px 20px 40px}
.msg-u{display:flex;flex-direction:column;align-items:flex-end;margin:22px 0 6px}
.msg-u .bubble{max-width:85%;background:var(--raise);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 6px 18px;white-space:pre-wrap;word-wrap:break-word}
.msg-u .atts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px;max-width:85%}
.msg-u .atts img{max-height:140px;max-width:220px;border-radius:12px;border:1px solid var(--line);display:block}
.msg-u .acts{opacity:0;transition:opacity .15s}
.msg-u:hover .acts,.msg-u:focus-within .acts{opacity:1}
.acts{display:flex;gap:2px;margin-top:4px;color:var(--faint);font-size:12.5px;align-items:center;flex-wrap:wrap}
.acts button{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:7px;color:var(--mute)}
.acts button:hover{background:var(--sunk);color:var(--text)}
.acts svg{width:15px;height:15px}
.acts .meta{padding:0 6px;color:var(--faint)}
.turn{margin:18px 0 10px;padding-left:16px;border-left:2px solid var(--voice,var(--line));position:relative}
.turn .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:4px}
.turn .who .pdot{width:8px;height:8px;border-radius:50%;background:var(--voice)}
.turn .who b{color:var(--text);font-weight:600}
.step+.step{margin-top:8px}
.step .stepwho{font-size:12px;color:var(--faint);margin:10px 0 2px;display:flex;align-items:center;gap:6px}
.step .stepwho i{width:7px;height:7px;border-radius:50%;display:inline-block}
.notice{font-size:13px;color:var(--warn);background:var(--accent-soft);border-radius:var(--r-sm);padding:6px 10px;margin:6px 0;display:flex;gap:8px;align-items:flex-start}
.notice.err{color:var(--err);background:var(--err-soft)}
.notice .x{flex:1}
.notice button{text-decoration:underline;font-weight:600;color:inherit}
.info-line{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px;margin:6px 0}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--voice,var(--accent));animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--voice,var(--mute));opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}

/* markdown */
.md{word-wrap:break-word;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:.55em 0}
.md h1,.md h2,.md h3,.md h4{font-family:var(--f-disp);line-height:1.25;margin:1.1em 0 .45em;letter-spacing:-.01em}
.md h1{font-size:1.5em}.md h2{font-size:1.28em}.md h3{font-size:1.1em}.md h4{font-size:1em}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md li{margin:.2em 0}
.md blockquote{margin:.7em 0;padding:.2em 1em;border-left:3px solid var(--line2);color:var(--mute)}
.md table{border-collapse:collapse;margin:.8em 0;font-size:14px;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--sunk);font-weight:600}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md img{max-width:100%;border-radius:10px}
.md code{font:500 .88em var(--f-mono);background:var(--code-bg);border:1px solid var(--line);padding:.08em .35em;border-radius:6px}
.md pre code{border:0;padding:0;background:none;font-weight:400}
.md .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.code{margin:.8em 0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--code-bg)}
.code .bar{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.code .bar .lang{flex:1}
.code .bar button{padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;color:var(--mute)}
.code .bar button:hover{background:var(--line);color:var(--text)}
.code .bar svg{width:14px;height:14px}
.code pre{margin:0;padding:12px 14px;overflow:auto;font:13px/1.55 var(--f-mono);max-height:520px}
.mermaid-out{background:var(--raise);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;overflow:auto;margin:.8em 0}
.mermaid-out svg{max-width:100%;height:auto}
details.think{margin:.4em 0 .8em;border:1px dashed var(--line2);border-radius:var(--r-md);padding:6px 12px;color:var(--mute);font-size:14px}
details.think summary{cursor:pointer;font-weight:600}
details.think .md{margin-top:6px}

/* highlight.js tokens */
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-name{color:#9b59d0}
.hljs-string,.hljs-attr,.hljs-template-tag{color:#1f8a5b}
.hljs-number,.hljs-literal{color:#c05a1a}
.hljs-comment,.hljs-quote{color:var(--faint);font-style:italic}
.hljs-title,.hljs-section,.hljs-function .hljs-title{color:#2f6fd1}
.hljs-type,.hljs-class .hljs-title{color:#b0428a}
.hljs-variable,.hljs-params{color:var(--text)}
.hljs-meta{color:var(--mute)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl-kw:#d3a6ff}}
:root[data-theme="dark"] .hljs-keyword,:root[data-theme="dark"] .hljs-built_in,:root[data-theme="dark"] .hljs-name{color:#d3a6ff}
:root[data-theme="dark"] .hljs-string,:root[data-theme="dark"] .hljs-attr{color:#86d9a8}
:root[data-theme="dark"] .hljs-number,:root[data-theme="dark"] .hljs-literal{color:#f5b27a}
:root[data-theme="dark"] .hljs-title{color:#8fbaff}
:root[data-theme="dark"] .hljs-type{color:#f29ad3}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .hljs-keyword,:root:not([data-theme="light"]) .hljs-built_in,:root:not([data-theme="light"]) .hljs-name{color:#d3a6ff}
  :root:not([data-theme="light"]) .hljs-string,:root:not([data-theme="light"]) .hljs-attr{color:#86d9a8}
  :root:not([data-theme="light"]) .hljs-number,:root:not([data-theme="light"]) .hljs-literal{color:#f5b27a}
  :root:not([data-theme="light"]) .hljs-title{color:#8fbaff}
  :root:not([data-theme="light"]) .hljs-type{color:#f29ad3}
}

/* tool rows */
.tool{border:1px solid var(--line);border-radius:var(--r-md);margin:8px 0;background:var(--raise);font-size:14px;overflow:hidden}
.tool>summary{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;list-style:none}
.tool>summary::-webkit-details-marker{display:none}
.tool>summary .ti{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--mute);flex:none}
.tool>summary .ti svg{width:15px;height:15px}
.tool>summary .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool>summary .tt b{font-weight:600}
.tool>summary .st{font-size:12px;color:var(--faint)}
.tool>summary .st.ok{color:var(--ok)}.tool>summary .st.bad{color:var(--err)}
.tool .tb{border-top:1px solid var(--line);padding:10px 12px;max-height:420px;overflow:auto}
.tool .tb pre{margin:0;white-space:pre-wrap;font:12.5px/1.5 var(--f-mono);color:var(--mute)}
.tool .tb .res{margin:0 0 10px}
.tool .tb .res a{font-weight:600;text-decoration:none}
.tool .tb .res a:hover{text-decoration:underline}
.tool .tb .res small{display:block;color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .tb .res p{margin:2px 0 0;color:var(--mute);font-size:13px}
.tool .tb img{max-width:100%;border-radius:8px;margin-top:8px;background:#fff}
.tool .tb h5{margin:10px 0 4px;font-size:12px;color:var(--faint);font-weight:600}

/* file cards */
.fcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--raise);border-radius:var(--r-md);padding:10px 10px 10px 10px;margin:10px 0;max-width:520px}
.fcard .fi{width:42px;height:46px;border-radius:8px;display:grid;place-items:center;font:700 11px/1 var(--f-mono);color:#fff;flex:none;letter-spacing:.02em}
.fcard .fm{flex:1;min-width:0}
.fcard .fm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .fm span{font-size:12.5px;color:var(--mute)}
.fcard .fa{display:flex;gap:4px}
.fcard .fa button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.fcard .fa button:hover{border-color:var(--line2);background:var(--sunk)}
.fcard .fa button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fcard .fa svg{width:14px;height:14px}
.fcard.writing .fi{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.zipbar{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin:4px 0 10px}
.zipbar button{color:var(--accent);font-weight:600}
figure.gimg{margin:10px 0;max-width:520px}
figure.gimg .frame{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--sunk);min-height:120px;display:grid;place-items:center;position:relative}
figure.gimg img{display:block;width:100%;height:auto}
figure.gimg figcaption{font-size:12.5px;color:var(--mute);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
figure.gimg figcaption span{flex:1}
figure.gimg figcaption button{color:var(--mute);padding:2px 6px;border-radius:6px;display:inline-flex}
figure.gimg figcaption button:hover{background:var(--sunk);color:var(--text)}
figure.gimg .ph{padding:30px;color:var(--mute);font-size:13px;display:flex;gap:8px;align-items:center;text-align:center}

/* ---------- empty state ---------- */
.hero{max-width:720px;margin:9vh auto 0;padding:0 20px;text-align:center}
.hero h1{font:800 clamp(56px,9vw,92px)/.9 var(--f-disp);letter-spacing:-.045em;margin:0}
.hero p.sub{color:var(--mute);margin:12px 0 26px;font-size:16px}
.voices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:30px}
.voice{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:13.5px}
.voice:hover{border-color:var(--c);}
.voice i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.voice small{color:var(--faint);font-size:12px}
.voice.off i{background:transparent;border:2px solid var(--c);box-shadow:none}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.sug{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:transparent;font-size:14px;color:var(--text);display:flex;gap:10px;align-items:flex-start}
.sug:hover{background:var(--raise);border-color:var(--line2)}
.sug svg{color:var(--accent);margin-top:2px}

/* ---------- composer ---------- */
#composer{padding:0 20px 16px}
.cbox{max-width:800px;margin:0 auto;border:1px solid var(--line2);background:var(--raise);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:border-color .15s}
.cbox:focus-within{border-color:var(--accent)}
.cbox.drag{border-style:dashed;border-color:var(--accent)}
.c-atts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px;font-size:12.5px;max-width:240px;background:var(--panel)}
.att img{width:28px;height:28px;object-fit:cover;border-radius:6px}
.att .ab{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font:700 9px var(--f-mono);color:#fff}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att button{color:var(--faint);padding:2px;border-radius:5px;display:inline-flex}
.att button:hover{color:var(--err)}
#input{width:100%;border:0;outline:none;background:transparent;resize:none;padding:14px 16px 6px;max-height:40vh;min-height:52px;line-height:1.5;display:block}
.c-bar{display:flex;align-items:center;gap:4px;padding:6px 8px 8px}
.c-bar .grow{flex:1}
.c-bar .icon-btn{width:34px;height:34px}
#sendBtn{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
#sendBtn:disabled{opacity:.4;cursor:default}
#sendBtn.stop{background:var(--text);color:var(--bg)}
.c-hint{max-width:800px;margin:6px auto 0;font-size:12px;color:var(--faint);text-align:center;min-height:16px}
.c-hint b{color:var(--mute);font-weight:600}
.modebadge{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:4px}

/* ---------- side panel ---------- */
.p-head{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);min-height:56px}
.p-head .pt{flex:1;min-width:0}
.p-head .pt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-head .pt span{font-size:12px;color:var(--mute)}
.p-head .btn{padding:6px 10px}
.p-tabs{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.p-tabs button{padding:5px 10px;border-radius:8px;font-size:13px;color:var(--mute);white-space:nowrap}
.p-tabs button.on{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.p-body{flex:1;overflow:auto;min-height:0;position:relative}
.p-body iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.p-body .doc{background:#fff;color:#1d1d1f;margin:16px;padding:40px 44px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12);font:15px/1.65 Georgia,"Times New Roman",serif}
.p-body .doc h1,.p-body .doc h2,.p-body .doc h3{font-family:var(--f-ui);color:#111}
.p-body .doc table td,.p-body .doc table th{border-color:#ccc}
.p-body .doc th{background:#f3f3f3}
.p-body .doc code{background:#f3f3f3;border-color:#ddd}
.p-body pre.src{margin:0;padding:16px;font:13px/1.55 var(--f-mono);white-space:pre;overflow:auto;min-height:100%}
.p-body .sheet{padding:12px;overflow:auto}
.p-body .sheet table{border-collapse:collapse;font-size:13px;background:var(--raise)}
.p-body .sheet td,.p-body .sheet th{border:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.p-body .sheet th{background:var(--sunk);position:sticky;top:0}
.p-body .slides{padding:16px;display:grid;gap:14px}
.p-body .slide{aspect-ratio:16/9;background:#fff;color:#222;border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.14);padding:5% 6%;overflow:hidden;position:relative;font-family:var(--f-ui)}
.p-body .slide h2{margin:0 0 4%;font-size:clamp(14px,2.4vw,24px);color:#2A1E33;border-bottom:3px solid #F2B33D;padding-bottom:2%}
.p-body .slide ul{margin:0;padding-left:1.2em;font-size:clamp(10px,1.5vw,15px)}
.p-body .slide .num{position:absolute;right:3%;bottom:3%;font-size:11px;color:#999}
.p-body .imgv{padding:16px;display:grid;place-items:center}
.p-body .imgv img{max-width:100%;border-radius:8px}
.p-body .flist{padding:10px}
.p-body .empty{padding:40px 24px;color:var(--mute);text-align:center}
.p-foot{border-top:1px solid var(--line);padding:8px 12px;font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:center}

/* ---------- buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--err)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg{width:15px;height:15px}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field>small{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}
.inp{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--raise);outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
.switch{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.switch input{appearance:none;width:36px;height:21px;border-radius:999px;background:var(--line2);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(15px)}
.switch .sw-t{flex:1}
.switch .sw-t b{display:block;font-weight:500;font-size:14px}
.switch .sw-t small{color:var(--mute);font-size:12.5px}
.codecopy{position:relative;margin:8px 0 14px}
.codecopy pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.5 var(--f-mono);white-space:pre-wrap;max-height:240px;overflow:auto}
.codecopy button{position:absolute;top:6px;right:6px}
ol.steps{padding-left:1.3em;margin:0 0 12px}
ol.steps li{margin:6px 0}

/* ---------- dialogs ---------- */
dialog{border:1px solid var(--line);border-radius:var(--r-lg);padding:0;background:var(--panel);color:var(--text);box-shadow:var(--shadow);max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(20,10,30,.45);backdrop-filter:blur(3px)}
dialog[open]{display:flex;flex-direction:column}
.d-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 20px}
.d-head h2{flex:1;margin:0;font:700 19px/1.2 var(--f-disp);letter-spacing:-.01em}
.d-body{overflow:auto;padding:4px 20px 20px;min-height:0}
#modelDlg{width:880px;height:min(680px,calc(100dvh - 24px))}
.mp{display:grid;grid-template-columns:250px 1fr;min-height:0;flex:1;border-top:1px solid var(--line)}
.mp-prov{border-right:1px solid var(--line);overflow:auto;padding:8px}
.mp-prov .row{padding:8px 10px}
.mp-prov .row small{display:block;color:var(--faint);font-size:11.5px;line-height:1.3}
.mp-prov .row .t{white-space:normal}
.mp-right{display:flex;flex-direction:column;min-height:0}
.mp-search{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.mp-search input{flex:1}
.mp-info{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--mute);background:var(--raise)}
.mp-info b{color:var(--text)}
.mp-info .acts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mp-list{overflow:auto;flex:1;padding:6px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;width:100%;text-align:left}
.mrow:hover,.mrow.kb{background:var(--sunk)}
.mrow.on{background:var(--accent-soft)}
.mrow .mm{flex:1;min-width:0}
.mrow .mm b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mm small{display:block;color:var(--faint);font:12px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--mute);white-space:nowrap;border:1px solid var(--line)}
.tag.g{color:var(--ok)}.tag.a{color:var(--accent)}
.star{color:var(--faint);padding:4px;border-radius:6px;display:inline-flex}
.star:hover{color:var(--accent)}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}
.mp-empty{padding:30px;text-align:center;color:var(--mute);font-size:14px}
#settingsDlg{width:780px;height:min(720px,calc(100dvh - 24px))}
.st-wrap{display:grid;grid-template-columns:180px 1fr;min-height:0;flex:1;border-top:1px solid var(--line)}
.st-nav{border-right:1px solid var(--line);padding:8px;overflow:auto}
.st-nav button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--mute);font-size:14px}
.st-nav button.on{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.st-body{overflow:auto;padding:18px 22px}
.st-body h3{margin:0 0 12px;font:700 17px var(--f-disp)}
.st-body h4{margin:18px 0 8px;font-size:14px}
.st-body p.lead{color:var(--mute);margin:0 0 14px;font-size:14px}
.pcard{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;background:var(--raise)}
.pcard .ph{display:flex;align-items:center;gap:10px}
.pcard .ph i{width:10px;height:10px;border-radius:50%;flex:none}
.pcard .ph b{flex:1}
.pcard p{margin:6px 0 0;font-size:13px;color:var(--mute)}
.pcard .field{margin:10px 0 0}
.fb-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.fb-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--raise);font-size:14px}
.fb-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-item{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.mem-item span{flex:1}
.small-dlg{width:460px}
.small-dlg .d-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}

/* menus & toasts */
.menu{position:fixed;z-index:60;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;min-width:190px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:14px;text-align:left}
.menu button:hover{background:var(--sunk)}
.menu button.danger{color:var(--err)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .mh{font-size:12px;color:var(--faint);padding:6px 10px 2px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);pointer-events:auto;max-width:min(560px,92vw);display:flex;gap:10px;align-items:center}
.toast.err{background:var(--err);color:#fff}
.toast button{font-weight:700;text-decoration:underline;color:inherit}
#bridgeHost{position:fixed;width:2px;height:2px;left:-50px;top:-50px;overflow:hidden;opacity:0;pointer-events:none}
#bridgeHost.show{position:static;width:auto;height:100%;opacity:1;pointer-events:auto;left:auto;top:auto}
#bridgeHost iframe{width:100%;height:100%;border:0}
.scrim{display:none}

/* ---------- responsive ---------- */
@media (max-width:980px){
  #panel.open{position:fixed;inset:0;width:100%;z-index:40}
}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:50;transform:translateX(-102%);transition:transform .22s ease;box-shadow:none}
  body.side-open #side{box-shadow:var(--shadow)}
  body.side-open #side{transform:none}
  body.side-open .scrim{display:block;position:fixed;inset:0;background:rgba(20,10,30,.4);z-index:45}
  #menuBtn{display:inline-grid}
  #thread{padding:4px 16px 30px}
  #composer{padding:0 10px 10px}
  .sugs{grid-template-columns:1fr}
  .hero{margin-top:5vh}
  .chip{max-width:150px}
  .mp{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .mp-prov{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px}
  .mp-prov .row{width:auto;white-space:nowrap;flex:none}
  .mp-prov .row small,.mp-prov .grp{display:none}
  .st-wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .st-nav{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .st-nav button{width:auto;white-space:nowrap}
  #modelDlg,#settingsDlg{width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;border-radius:0}
  .msg-u .bubble{max-width:92%}
  .fcard{flex-wrap:wrap}
  .fcard .fa{width:100%;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* marca y áreas seguras (móvil con muesca / Android) */
.brand .mark{width:28px;height:28px;display:block;flex:none}
#top{padding-top:max(10px,env(safe-area-inset-top))}
#composer{padding-bottom:max(16px,env(safe-area-inset-bottom))}
.side-foot{padding-bottom:max(8px,env(safe-area-inset-bottom))}
.brand{padding-top:max(18px,env(safe-area-inset-top))}
html[data-platform="android"] .c-hint{display:none}

body.pwide #main{display:none}
body.pwide #panel.open{width:auto;transition:none}

.p-head .pt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pActs{display:flex;gap:6px;flex:none;align-items:center}
@media (max-width:520px){.p-head .pt span{display:none}}

      <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema"></button>
    </div>
    <button class="side-new" id="newChatBtn"></button>
    <div class="side-search"><span id="searchIco"></span><input id="searchInp" type="search" placeholder="Buscar chats" aria-label="Buscar chats"></div>

      <button class="icon-btn" id="panelBtn" title="Archivos y vista previa" aria-label="Archivos y vista previa"></button>

<dialog id="modelDlg" aria-label="Elegir modelo">

    </div>
  </div>
</dialog>

<dialog id="settingsDlg" aria-label="Ajustes">

</dialog>

<dialog id="askDlg" class="small-dlg">

  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(new DOMException("Tiempo de espera agotado", "TimeoutError")), ms);
  const outer = opts.signal; const onAbort = () => ctl.abort(outer.reason);
  if (outer) { if (outer.aborted) ctl.abort(outer.reason); else outer.addEventListener("abort", onAbort, { once: true }); }

    if (e?.name === "AbortError" || e?.name === "TimeoutError") { const er = new Error("Tiempo de espera agotado"); er.timeout = true; throw er; }
    const er = new Error("Sin conexión con " + new URL(url, location.href).host + " (red o CORS)"); er.network = true; throw er;
  }
  finally { clearTimeout(t); }
}

/* ---------- almacenamiento: IndexedDB (con respaldo en memoria) ---------- */
const DB = {
  db: null, mem: new Map(), broken: false,
  async open() {
    if (this.db || this.broken) return this.db;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("muse-v2", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.broken = true; console.warn("IndexedDB no disponible", e); toast("Tu navegador no deja guardar datos aquí: los chats se perderán al cerrar.", { err: true }); }
    return this.db;
  },
  async tx(mode, fn) {
    const db = await this.open(); if (!db) return fn(null);
    return new Promise((res, rej) => { const t = db.transaction("kv", mode); const st = t.objectStore("kv"); const r = fn(st); t.oncomplete = () => res(r?.result); t.onerror = () => rej(t.error); });
  },
  async get(k) { if (!(await this.open())) return this.mem.get(k); return this.tx("readonly", (s) => s.get(k)); },
  async set(k, v) { if (!(await this.open())) { this.mem.set(k, v); return; } return this.tx("readwrite", (s) => s.put(v, k)); },
  async del(k) { if (!(await this.open())) { this.mem.delete(k); return; } return this.tx("readwrite", (s) => s.delete(k)); },
  async keys() { if (!(await this.open())) return [...this.mem.keys()]; return this.tx("readonly", (s) => s.getAllKeys()); },
};

const APP_NAME = "Constela";
const PLATFORM = window.desktop ? "windows" : (window.Capacitor?.isNativePlatform?.() ? "android" : "web");
document.documentElement.dataset.platform = PLATFORM;
const capPlugin = (n) => window.Capacitor?.Plugins?.[n] || null;
const safeName = (n) => String(n || "archivo").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "_").replace(/^\.+/, "").slice(0, 150) || "archivo";

async function androidUniquePath(FS, path) {
  const dot = path.lastIndexOf("."); const base = dot > 0 ? path.slice(0, dot) : path; const ext = dot > 0 ? path.slice(dot) : "";
  for (let i = 0; i < 200; i++) {
    const p = i ? `${base} (${i})${ext}` : path;
    try { await FS.stat({ path: p, directory: "DOCUMENTS" }); } catch (e) { return p; }
  }
  return `${base}-${Date.now()}${ext}`;
}
/** Guarda un archivo de la forma correcta en cada plataforma. */
async function saveBlob(blob, name) {
  name = safeName(name);
  if (PLATFORM === "windows") {
    const r = await window.desktop.saveFile(name, new Uint8Array(await blob.arrayBuffer()));
    if (!r || r.canceled) return;
    toast("Guardado: " + r.path.split(/[\\/]/).pop(), { action: { label: "Mostrar en la carpeta", fn: () => window.desktop.showInFolder(r.path) }, ms: 6000 });
    return;
  }
  if (PLATFORM === "android") {
    const FS = capPlugin("Filesystem"), Share = capPlugin("Share");
    const b64 = (await blobToDataUrl(blob)).split(",")[1] || "";
    try {
      try { await FS.requestPermissions?.(); } catch (e) {}
      const path = await androidUniquePath(FS, `${APP_NAME}/${name}`);
      const res = await FS.writeFile({ path, data: b64, directory: "DOCUMENTS", recursive: true });
      toast("Guardado en Documentos/" + path, { action: Share ? { label: "Abrir o compartir", fn: () => Share.share({ title: name, url: res.uri, dialogTitle: "Abrir con…" }).catch(() => {}) } : null, ms: 7000 });
    } catch (e) {
      console.warn("Documentos no disponible, uso compartir", e);
      const res = await FS.writeFile({ path: name, data: b64, directory: "CACHE" });
      await Share.share({ title: name, url: res.uri, dialogTitle: "Guardar o compartir " + name });
    }
    return;
  }
  download(blob, name);
}
/** Lee una URL saltándose CORS cuando la app es nativa (Windows/Android). Devuelve null en la web. */

  if (PLATFORM === "windows") { const r = await window.desktop.fetchText(url, headers); if (r.status >= 400) throw new Error("HTTP " + r.status); return r.text; }

    if (r.status >= 400) throw new Error("HTTP " + r.status);

   Proveedores: todos sin API key
   Cada uno: list() -> modelos, chat(req) -> generador de eventos

/* ---------- streaming estilo OpenAI (Pollinations, LLM7, OVH, servidores locales) ---------- */
async function* openaiCompat({ url, headers = {}, body, signal, where, timeout = 120000 }) {
  const r = await fetchT(url, { method: "POST", headers: { "Content-Type": "application/json", ...headers }, body: JSON.stringify(body), signal }, timeout);
  if (!r.ok) throw new HttpError(r.status, await r.text().catch(() => ""), where);

    if (j.error) throw new HttpError(j.error.code || 500, raw, where);
    const m = j.choices?.[0]?.message || {};
    const rs = m.reasoning_content || m.reasoning; if (rs) yield { type: "reasoning", text: rs };
    if (m.content) yield { type: "text", text: typeof m.content === "string" ? m.content : m.content.map((p) => p.text || "").join("") };
    if (m.tool_calls?.length) yield { type: "tool_calls", calls: m.tool_calls.map((tc) => ({ id: tc.id || "call_" + uid(), name: tc.function?.name, args: safeJSON(tc.function?.arguments) })) };
    return;
  }
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = ""; const acc = [];
  try {
    while (true) {
      if (signal?.aborted) { reader.cancel().catch(() => {}); return; }
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim(); if (!data || data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch (e) { continue; }
        if (j.error) throw new HttpError(j.error.code || j.error.status || 500, JSON.stringify(j), where);
        const ch = j.choices?.[0] || {}; const d = ch.delta || ch.message || {};
        const rs = d.reasoning_content ?? d.reasoning; if (rs) yield { type: "reasoning", text: rs };
        if (d.content) yield { type: "text", text: d.content };
        if (d.tool_calls) for (const tc of d.tool_calls) {
          const k = tc.index ?? acc.length;
          acc[k] ||= { id: "", name: "", args: "" };
          if (tc.id) acc[k].id = tc.id;
          if (tc.function?.name && !acc[k].name) acc[k].name = tc.function.name;
          const a = tc.function?.arguments; if (a) acc[k].args += typeof a === "string" ? a : JSON.stringify(a);
        }
      }
    }
  } catch (e) { if (signal?.aborted) return; throw e; }
  const calls = acc.filter((c) => c && c.name).map((c) => ({ id: c.id || "call_" + uid(), name: c.name, args: safeJSON(c.args) }));
  if (calls.length) yield { type: "tool_calls", calls };
}

async function listOpenAIModels(url, headers = {}, ms = 10000) {

const Bridge = {
  frame: null, win: null, ready: false, url: "", pending: new Map(),
  host() { return $("#bridgeHost"); },
  targets() {
    const out = []; if (this.win) out.push(this.win);
    const cw = this.frame?.contentWindow; if (cw) { out.push(cw); try { for (let i = 0; i < cw.length; i++) { out.push(cw[i]); try { for (let k = 0; k < cw[i].length; k++) out.push(cw[i][k]); } catch (e) {} } } catch (e) {} }
    return out;
  },
  post(msg) { for (const t of this.targets()) { try { t.postMessage({ __muse: 1, from: "app", ...msg }, "*"); } catch (e) {} } },
  mount() {
    const url = (S.settings.providers.perchance.url || "").trim();
    if (!url) { const e = new Error("Falta configurar el puente de Perchance (Ajustes › Perchance)."); e.noRetry = false; e.needsBridge = true; throw e; }
    if (this.frame && this.url === url) return;
    this.host().innerHTML = ""; this.ready = false; this.win = null; this.url = url;
    this.frame = h("iframe", { src: url, title: "Puente de Perchance", allow: "clipboard-write" });
    this.host().append(this.frame);
  },
  async ensure(timeout = 25000) {
    this.mount(); if (this.ready) return;
    const t0 = Date.now();
    while (!this.ready && Date.now() - t0 < timeout) { this.post({ type: "ping", id: "ping" }); await sleep(1200); }
    if (!this.ready) { const e = new Error("El puente de Perchance no responde. Revisa que pegaste el código del puente y guardaste el generador (Ajustes › Perchance)."); e.needsBridge = true; throw e; }
  },
  request(msg, onMsg) { const id = uid(); this.pending.set(id, onMsg); this.post({ ...msg, id }); return id; },
  forget(id) { this.pending.delete(id); },
  async image(prompt, w = 512, hgt = 512, signal) {
    await this.ensure();
    return new Promise((res, rej) => {
      const to = setTimeout(() => { this.forget(id); rej(new Error("Perchance tardó demasiado en dibujar")); }, 120000);
      const id = this.request({ type: "image", prompt, resolution: `${w}x${hgt}` }, (m) => {
        if (m.type === "image") { clearTimeout(to); this.forget(id); m.dataUrl ? res(m.dataUrl) : rej(new Error(m.error || "Perchance no devolvió imagen")); }
        if (m.type === "error") { clearTimeout(to); this.forget(id); rej(new Error("Perchance: " + m.error)); }
      });
      signal?.addEventListener("abort", () => { clearTimeout(to); this.forget(id); rej(new DOMException("Detenido", "AbortError")); });
    });
  },
};
window.addEventListener("message", (ev) => {
  const d = ev.data; if (!d || d.__muse !== 1 || d.from === "app") return;
  if (d.type === "ready" || d.type === "pong") { Bridge.win = ev.source; if (!Bridge.ready) { Bridge.ready = true; refreshProviderStatus("perchance"); } return; }
  const fn = Bridge.pending.get(d.id); if (fn) fn(d);
});

/* --- lectura de webs sin CORS: Puter (si está conectado) → Jina Reader → proxies públicos --- */
async function corsFetch(url, { want = "html", signal } = {}) {
  const errors = [];
  if (PLATFORM !== "web") {
    try { const t = await nativeFetchText(url); if (t && t.length > 50) return { text: t, via: "app", kind: "html" }; } catch (e) { errors.push("app: " + (e.message || e)); }
  }
  if (window.puter && (await Puter.isSignedIn())) {
    try { const r = await puter.net.fetch(url); const t = await r.text(); if (t && t.length > 50) return { text: t, via: "puter", kind: "html" }; } catch (e) { errors.push("puter: " + (e.message || e)); }
  }
  try {
    const headers = want === "html" ? { "X-Return-Format": "html" } : {};
    const r = await fetchT("https://r.jina.ai/" + url, { headers, signal }, 25000);
    if (r.ok) { const t = await r.text(); if (t && t.length > 50) return { text: t, via: "jina", kind: want === "html" ? "html" : "md" }; }
    else errors.push("jina: " + r.status);
  } catch (e) { errors.push("jina: " + e.message); }
  for (const proxy of ["https://api.allorigins.win/raw?url=", "https://corsproxy.io/?url="]) {
    try { const r = await fetchT(proxy + encodeURIComponent(url), { signal }, 20000); if (r.ok) { const t = await r.text(); if (t && t.length > 50) return { text: t, via: new URL(proxy).host, kind: "html" }; } else errors.push(new URL(proxy).host + ": " + r.status); }
    catch (e) { errors.push(new URL(proxy).host + ": " + e.message); }
  }
  throw new Error("No pude leer " + url + " (" + errors.join("; ") + ")");
}
function htmlToText(html, base) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script,style,noscript,svg,iframe,nav,footer,header,form,aside,[aria-hidden=true]").forEach((n) => n.remove());
  const title = doc.title || "";
  const main = doc.querySelector("article, main, [role=main]") || doc.body;
  const out = [];
  const walk = (n) => {
    for (const c of n.childNodes) {
      if (c.nodeType === 3) { const t = c.textContent.replace(/\s+/g, " "); if (t.trim()) out.push(t); continue; }
      if (c.nodeType !== 1) continue;
      const tag = c.tagName;
      if (/^H[1-6]$/.test(tag)) { out.push("\n\n" + "#".repeat(+tag[1]) + " " + c.textContent.trim() + "\n"); continue; }
      if (tag === "A" && c.getAttribute("href") && c.textContent.trim()) { let href = c.getAttribute("href"); try { href = new URL(href, base).href; } catch (e) {} out.push(` [${c.textContent.trim()}](${href}) `); continue; }
      if (tag === "LI") out.push("\n- ");
      if (/^(P|DIV|SECTION|BR|TR|UL|OL|TABLE|BLOCKQUOTE|PRE)$/.test(tag)) out.push("\n");
      walk(c);
      if (/^(P|DIV|SECTION|TR|TABLE|BLOCKQUOTE|PRE)$/.test(tag)) out.push("\n");
    }
  };
  if (main) walk(main);
  const text = out.join("").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
  return { title, text };
}

async function searchDDG(q, n, signal) {
  const { text } = await corsFetch("https://html.duckduckgo.com/html/?q=" + encodeURIComponent(q), { signal });
  const doc = new DOMParser().parseFromString(text, "text/html"); const out = [];
  for (const r of doc.querySelectorAll(".result")) {
    const a = r.querySelector("a.result__a"); if (!a) continue;
    let href = a.getAttribute("href") || "";
    const m = /[?&]uddg=([^&]+)/.exec(href); if (m) href = decodeURIComponent(m[1]); else if (href.startsWith("//")) href = "https:" + href;
    if (/duckduckgo\.com\/y\.js/.test(href)) continue;
    out.push({ title: a.textContent.trim(), url: href, snippet: (r.querySelector(".result__snippet")?.textContent || "").trim() });
    if (out.length >= n) break;
  }
  return out;
}

/* --- JavaScript aislado en un Web Worker --- */
function runJS(code, timeout = 15000) {
  return new Promise((resolve) => {
    const src = `const __logs=[];const __f=v=>{try{if(typeof v==="string")return v;if(v instanceof Error)return v.stack||String(v);return JSON.stringify(v,null,2)??String(v)}catch(e){return String(v)}};
["log","info","warn","error","table","debug"].forEach(k=>{console[k]=(...a)=>__logs.push((k==="error"||k==="warn"?k.toUpperCase()+": ":"")+a.map(__f).join(" "))});
onmessage=async(e)=>{let r,err=null;try{try{r=(0,eval)(e.data)}catch(se){if(se instanceof SyntaxError&&/await|return/.test(String(se.message)+e.data)){r=await (async()=>{}).constructor(e.data)()}else throw se}if(r&&typeof r.then==="function")r=await r}catch(x){err=x&&x.stack?String(x.stack).split("\\n").slice(0,4).join("\\n"):String(x)}postMessage({logs:__logs,result:r===undefined?undefined:__f(r),error:err})}`;
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    const t = setTimeout(() => { w.terminate(); resolve({ logs: [], error: "Tiempo agotado (" + timeout / 1000 + " s)" }); }, timeout);
    w.onmessage = (e) => { clearTimeout(t); w.terminate(); resolve(e.data); };
    w.onerror = (e) => { clearTimeout(t); w.terminate(); resolve({ logs: [], error: e.message }); };
    w.postMessage(code);
  });
}

let _py = null;
async function getPyodide(info) {

async function runPython(code, info) {
  const py = await getPyodide(info);
  const out = [];
  py.setStdout({ batched: (s) => out.push(s) }); py.setStderr({ batched: (s) => out.push("ERR: " + s) });
  const before = new Set(py.FS.readdir("."));
  let result = null, error = null;
  try {
    info?.("Instalando paquetes que usa el código…");
    await py.loadPackagesFromImports(code, { messageCallback: () => {} });
    info?.("Ejecutando Python…");
    const r = await py.runPythonAsync(code);
    if (r !== undefined && r !== null) { result = String(r?.toString?.() ?? r); try { r.destroy?.(); } catch (e) {} }
  } catch (e) { error = String(e.message || e).split("\n").slice(-8).join("\n"); }
  const images = [];
  try {
    const b64 = await py.runPythonAsync(`
import sys
_imgs=[]
if 'matplotlib.pyplot' in sys.modules:
    import matplotlib.pyplot as _plt, io as _io, base64 as _b64
    for _n in _plt.get_fignums():
        _b=_io.BytesIO(); _plt.figure(_n).savefig(_b, format='png', dpi=110, bbox_inches='tight'); _imgs.append(_b64.b64encode(_b.getvalue()).decode())
    _plt.close('all')
'\\n'.join(_imgs)`);
    for (const s of String(b64 || "").split("\n")) if (s) images.push("data:image/png;base64," + s);
  } catch (e) {}
  const files = [];
  try {
    for (const name of py.FS.readdir(".")) {
      if (name === "." || name === ".." || before.has(name)) continue;
      const st = py.FS.stat(name); if (py.FS.isDir(st.mode)) continue;
      const data = py.FS.readFile(name); files.push({ name, blob: new Blob([data], { type: mimeFor(extOf(name)) }) });

  return { stdout: out.join("\n"), result, error, images, files };
}

/* --- calculadora segura --- */
function calc(expr) {
  let e = String(expr).replace(/×/g, "*").replace(/÷/g, "/").replace(/,(?=\d{3}\b)/g, "").replace(/\^/g, "**").replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");
  const ids = e.match(/[a-zA-Z_]+/g) || [];
  const ok = new Set([...Object.getOwnPropertyNames(Math), "pi", "e", "ln", "log10", "sqrt"]);
  for (const id of ids) if (!ok.has(id)) throw new Error("Expresión no permitida: " + id);
  if (/[^0-9a-zA-Z_+\-*/().,%<>=!&|?: \n]/.test(e)) throw new Error("Caracteres no permitidos");
  e = e.replace(/\bpi\b/g, "PI").replace(/\be\b/g, "E").replace(/\bln\b/g, "log");
  // eslint-disable-next-line no-new-func
  const v = Function("with(Math){return (" + e + ")}")();
  if (typeof v !== "number" && typeof v !== "boolean") throw new Error("Resultado no numérico");
  return v;
}

/* ---------- utilidades de texto ---------- */
const decodeEnt = (s) => String(s ?? "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");

function parseCSV(text, delim) {

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
    if (c === '"' && cell === "") { q = true; continue; }
    if (c === delim) { row.push(cell); cell = ""; continue; }
    if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; continue; }
    cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => String(c).trim() !== ""));
}
function typed(v) {
  const s = String(v ?? "").trim();
  if (/^=/.test(s)) return { t: "n", f: s.slice(1) };
  if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return Number(s.replace(/,/g, ""));
  if (/^-?\d+(\.\d+)?%$/.test(s)) return { t: "n", v: Number(s.slice(0, -1)) / 100, z: "0.00%" };
  if (/^(true|false)$/i.test(s)) return /^true$/i.test(s);
  return stripInline(s);
}
function parseTable(body) {
  const lines = String(body || "").trim().split(/\r?\n/);
  if (lines.filter((l) => /^\s*\|/.test(l)).length >= 2) {
    return lines.filter((l) => /^\s*\|/.test(l) && !/^\s*\|?\s*:?-{2,}/.test(l)).map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
  }
  const first = lines[0] || ""; const count = (ch) => first.split(ch).length - 1;
  const delim = count("\t") > 0 ? "\t" : count(";") > count(",") ? ";" : ",";
  return parseCSV(String(body).trim(), delim);
}
function splitSheets(text) {
  const parts = []; let cur = { name: "Hoja1", body: [] };
  for (const line of String(text).split(/\r?\n/)) {
    const m = /^\s*#{1,4}\s*Hoja\s*:?\s*(.+)$/i.exec(line);
    if (m) { if (cur.body.join("").trim()) parts.push(cur); cur = { name: m[1].trim(), body: [] }; continue; }
    cur.body.push(line);
  }
  if (cur.body.join("").trim() || !parts.length) parts.push(cur);
  return parts.map((p, i) => ({ name: (p.name || "Hoja" + (i + 1)).replace(/[\\\/?*\[\]:]/g, " ").slice(0, 31) || "Hoja" + (i + 1), body: p.body.join("\n") }));
}
function parseSlides(md) {

    const m = /^\s*#{1,2}\s+(.+)$/.exec(raw);
    if (m) { cur = { title: stripInline(m[1].trim()), bullets: [], notes: [] }; slides.push(cur); continue; }
    if (!cur) { if (!raw.trim()) continue; cur = { title: "", bullets: [], notes: [] }; slides.push(cur); }
    if (/^\s*---+\s*$/.test(raw) || !raw.trim()) continue;
    const nb = /^\s*>\s?(.*)$/.exec(raw); if (nb) { cur.notes.push(stripInline(nb[1])); continue; }
    const b = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(raw);

/* ---------- conversores ---------- */
function mdToDocxDoc(D, md, title) {
  const lex = window.marked ? window.marked.lexer(md) : [{ type: "paragraph", tokens: [{ type: "text", text: md }] }];
  const children = [];
  const HL = [null, D.HeadingLevel.HEADING_1, D.HeadingLevel.HEADING_2, D.HeadingLevel.HEADING_3, D.HeadingLevel.HEADING_4, D.HeadingLevel.HEADING_5, D.HeadingLevel.HEADING_6];
  const run = (text, f) => new D.TextRun({ text: decodeEnt(text), ...f });
  const inline = (tokens, f = {}) => {
    const out = [];
    for (const t of tokens || []) {
      switch (t.type) {
        case "strong": out.push(...inline(t.tokens, { ...f, bold: true })); break;
        case "em": out.push(...inline(t.tokens, { ...f, italics: true })); break;
        case "del": out.push(...inline(t.tokens, { ...f, strike: true })); break;
        case "codespan": out.push(run(t.text, { ...f, font: "Consolas" })); break;
        case "link": out.push(new D.ExternalHyperlink({ link: t.href, children: [run(t.text, { ...f, style: "Hyperlink" })] })); break;
        case "br": out.push(new D.TextRun({ text: "", break: 1 })); break;
        case "image": out.push(run("[imagen: " + (t.text || t.href) + "]", { ...f, italics: true })); break;
        case "text": if (t.tokens?.length) out.push(...inline(t.tokens, f)); else out.push(run(t.text, f)); break;
        case "html": out.push(run(String(t.text).replace(/<[^>]+>/g, ""), f)); break;
        default: out.push(run(t.text ?? t.raw ?? "", f));
      }
    }
    return out.length ? out : [new D.TextRun("")];

    switch (t.type) {
      case "heading": children.push(new D.Paragraph({ heading: HL[t.depth] || HL[3], children: inline(t.tokens), spacing: { before: 240, after: 120 } })); break;
      case "paragraph": children.push(new D.Paragraph({ children: inline(t.tokens), spacing: { after: 140 } })); break;
      case "text": children.push(new D.Paragraph({ children: inline(t.tokens || [{ type: "text", text: t.text }]) })); break;
      case "list":
        t.items.forEach((it, i) => {
          const sub = [], toks = [];
          for (const c of it.tokens || []) { if (c.type === "list") sub.push(c); else if (c.tokens) toks.push(...c.tokens); else if (c.text) toks.push({ type: "text", text: c.text }); }

          if (t.ordered) { runs.unshift(new D.TextRun(`${(+t.start || 1) + i}. `)); children.push(new D.Paragraph({ children: runs, indent: { left: 400 * (level + 1), hanging: 280 }, spacing: { after: 60 } })); }

        });
        children.push(new D.Paragraph({ children: [], spacing: { after: 80 } }));
        break;
      case "code": {
        const lines = String(t.text).split("\n");
        lines.forEach((ln, i) => children.push(new D.Paragraph({ children: [new D.TextRun({ text: ln || " ", font: "Consolas", size: 19 })], shading: { type: D.ShadingType.CLEAR, fill: "F3F0F6", color: "auto" }, spacing: { after: i === lines.length - 1 ? 160 : 0 } })));
        break;
      }
      case "blockquote":
        for (const c of t.tokens || []) {
          if (c.type === "paragraph") children.push(new D.Paragraph({ children: inline(c.tokens, { italics: true, color: "555555" }), indent: { left: 567 }, border: { left: { style: D.BorderStyle.SINGLE, size: 12, color: "BBBBBB", space: 8 } }, spacing: { after: 120 } }));
          else block(c, level);
        }
        break;
      case "table": {
        const cell = (c, head) => new D.TableCell({ children: [new D.Paragraph({ children: inline(c.tokens, head ? { bold: true } : {}) })], shading: head ? { type: D.ShadingType.CLEAR, fill: "EFEAF3", color: "auto" } : undefined, margins: { top: 60, bottom: 60, left: 100, right: 100 } });
        children.push(new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [new D.TableRow({ tableHeader: true, children: t.header.map((c) => cell(c, true)) }), ...t.rows.map((r) => new D.TableRow({ children: r.map((c) => cell(c, false)) }))] }));

        break;
      }
      case "hr": children.push(new D.Paragraph({ children: [], border: { bottom: { style: D.BorderStyle.SINGLE, size: 6, color: "CCCCCC", space: 1 } }, spacing: { after: 160 } })); break;
      case "space": break;
      case "html": { const s = String(t.text).replace(/<[^>]+>/g, "").trim(); if (s) children.push(new D.Paragraph(s)); break; }

    }

<archivo nombre="informe.docx">
contenido
</archivo>

- .xlsx: escribe CSV con encabezados en la primera fila; puedes usar fórmulas de Excel en inglés (=SUM(B2:B9)). Para varias hojas escribe antes de cada una la línea "### Hoja: Nombre".
- .pptx: cada diapositiva empieza con "# Título" y sigue con viñetas "- "; las notas del orador van en líneas que empiezan por "> ".
- Cualquier otra extensión (.html, .py, .js, .md, .csv, .json, .svg, .txt…) se guarda tal cual. Para proyectos con varios archivos usa rutas: "web/index.html", "web/style.css".

# Imágenes

  if (toolNames.length && tmode === "text") {
    parts.push(`# Herramientas

<herramienta nombre="buscar_web">{"consulta": "precio del cobre hoy"}</herramienta>
Disponibles:
${toolNames.map((n) => `- ${n} ${JSON.stringify(Object.fromEntries(Object.keys(TOOLS[n].params).map((k) => [k, TOOLS[n].params[k].type === "integer" ? 0 : "…"])))}: ${compact ? TOOLS[n].desc.split(".")[0] : TOOLS[n].desc}`).join("\n")}
Usa herramientas cuando necesites datos actuales, leer una página, calcular con exactitud o ejecutar código. Nunca inventes los resultados.`);
  } else if (toolNames.length && tmode === "native") {

function attText(a, old) {
  if (a.kind === "image") return "";
  const max = old ? 4000 : 60000; const t = String(a.text || "");
  return `\n\n[Archivo adjunto: ${a.name}]\n\`\`\`\n${t.slice(0, max)}${t.length > max ? "\n[…recortado…]" : ""}\n\`\`\``;
}
function shortenFiles(text, old) {
  if (!old) return text;
  return text.replace(/(<archivo\b[^>]*>)([\s\S]*?)(<\/archivo>)/gi, (m, a, body, c) => body.length > 2500 ? `${a}\n${body.slice(0, 1500)}\n[…contenido recortado; el archivo ya fue entregado…]\n${c}` : m);
}
function buildOpenAI(msgs, { native, vision, sys }) {
  const out = [{ role: "system", content: sys }]; const nativeIds = new Set();
  const lastUserIdx = msgs.map((m) => m.role).lastIndexOf("user");
  msgs.forEach((m, i) => {
    const old = i < lastUserIdx - 3;
    if (m.role === "user") {
      let text = m.content || ""; const imgs = [];
      for (const a of m.atts || []) { if (a.kind === "image") { if (vision) imgs.push(a.dataUrl); else text += `\n\n[Imagen adjunta «${a.name}»: el modelo actual no puede verla]`; } else text += attText(a, old); }
      if (m.imageMode) text = "Genera esta imagen: " + text;
      out.push(imgs.length ? { role: "user", content: [{ type: "text", text: text || "(imagen)" }, ...imgs.map((u) => ({ type: "image_url", image_url: { url: u } }))] } : { role: "user", content: text });
    } else if (m.role === "assistant") {
      if (m.plan) return;
      let text = shortenFiles(m.content || "", old);
      const calls = m.toolCalls || [];
      if (calls.length && native && m.toolMode === "native") {
        calls.forEach((c) => nativeIds.add(c.id));
        out.push({ role: "assistant", content: text || "", tool_calls: calls.map((c) => ({ id: c.id, type: "function", function: { name: c.name, arguments: JSON.stringify(c.args || {}) } })) });
      } else {
        if (calls.length && m.toolMode === "native") text += calls.map((c) => `\n<herramienta nombre="${c.name}">${JSON.stringify(c.args || {})}</herramienta>`).join("");
        if (text.trim()) out.push({ role: "assistant", content: text });
      }
    } else if (m.role === "tool") {
      const content = trunc(m.content || "", old ? 1500 : 12000);
      if (native && nativeIds.has(m.toolCallId)) out.push({ role: "tool", tool_call_id: m.toolCallId, content });
      else out.push({ role: "user", content: `[Resultado de la herramienta «${m.name}»]\n${content}` });
    }
  });
  // une mensajes consecutivos del mismo rol (algunos modelos exigen alternancia)
  const merged = [];
  for (const m of out) {
    const p = merged[merged.length - 1];
    if (p && p.role === m.role && (m.role === "user" || (m.role === "assistant" && !m.tool_calls && !p.tool_calls))) {
      const asParts = (c) => typeof c === "string" ? [{ type: "text", text: c }] : c;
      if (typeof p.content === "string" && typeof m.content === "string") p.content += "\n\n" + m.content;
      else p.content = [...asParts(p.content), ...asParts(m.content)];
    } else merged.push({ ...m });
  }

      st.output = outs.replace(/<herramienta\b[\s\S]*?<\/herramienta>/gi, "").trim();
      const err = msgs.filter((m) => m.role === "assistant").pop()?.error;

  });
  if (signal.aborted) return;
  planMsg.plan.status = "done"; renderThread();
  const results = subtasks.map((s, i) => `## Subtarea ${i + 1}: ${s.titulo} — resuelta por ${s.model?.name || "?"}\n${s.status === "ok" ? trunc(s.output, 9000) : "FALLÓ: " + (s.error || "")}`).join("\n\n");
  const synth = `# Trabajo del equipo
Has coordinado a varias IAs. Estos son sus resultados (el usuario aún no los ha leído):

${results}

Con todo esto, da al usuario la respuesta final: completa, ordenada y sin repetir el proceso interno. Si alguna subtarea falló, complétala tú. Si el usuario pidió archivos o imágenes, créalos ahora con las etiquetas.`;
  const cat = classify(userMsg.content, userMsg.atts);
  const synthChain = (await routeFor(cat === "rapido" ? "general" : cat === "investigacion" ? "escritura" : cat)).map((s, i) => [s, i]).sort((a, b) => ((PROVIDERS[a[0].p].budget < 20000) - (PROVIDERS[b[0].p].budget < 20000)) || a[1] - b[1]).map((x) => x[0]);
  await runAgent({ chat, msgs: chat.messages, chain: synthChain, signal, route: { mode: "team", category: "sintesis" }, extraSys: synth });
}

/* ---------- punto de entrada de cada turno ---------- */
async function runTurn() {
  const chat = S.chat; if (!chat || S.busy) return;
  S.busy = true; S.abort = new AbortController(); setBusyUI(true);
  const signal = S.abort.signal;
  try {
    const userMsg = [...chat.messages].reverse().find((m) => m.role === "user");
    if (userMsg?.imageMode) {
      const msg = { id: uid(), role: "assistant", content: `<imagen ancho="1024" alto="1024">${userMsg.content}</imagen>`, model: { p: S.settings.imageEngine === "puter" ? "puter" : S.settings.imageEngine === "perchance" ? "perchance" : "pollinations", id: "imagen", name: "Generador de imágenes" }, ts: Date.now() };
      chat.messages.push(msg); await finalizeMsg(chat, msg);
    } else {
      const mode = S.settings.aiMode || "auto";
      if (mode === "team") await runTeam(chat, userMsg, signal);
      else if (mode === "auto") { const cat = classify(userMsg?.content, userMsg?.atts); await runAgent({ chat, msgs: chat.messages, chain: await routeFor(cat), signal, route: { mode: "auto", category: cat } }); }
      else await runAgent({ chat, msgs: chat.messages, chain: await chainFixed(), signal });
    }
  } catch (e) {
    if (e?.name !== "AbortError") { console.error(e); chat.messages.push({ id: uid(), role: "assistant", content: "", ts: Date.now(), error: "Error inesperado: " + shortErr(e) }); }
  } finally {
    S.busy = false; S.abort = null; setBusyUI(false);
    if (chat.title === "Nuevo chat") { const u = chat.messages.find((m) => m.role === "user"); if (u) chat.title = trunc((u.content || u.atts?.[0]?.name || "Chat").replace(/\s+/g, " ").trim(), 48); }
    await saveChat(chat); if (S.chat === chat) { renderThread(); $("#chatTitle").value = chat.title; } renderChatList();
  }
}
function regenerate() {
  if (S.busy || !S.chat) return;
  const msgs = S.chat.messages; const li = msgs.map((m) => m.role).lastIndexOf("user"); if (li < 0) return;
  msgs.splice(li + 1); renderThread(); runTurn();
}
